name: Compilar APK Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar proyecto Android
        shell: bash
        run: |
          mkdir -p /tmp/fuerza-app/app/src/main/java/io/github/emanuelyt/fuerzaencasa
          mkdir -p /tmp/fuerza-app/app/src/main/assets/img
          cp app.html /tmp/fuerza-app/app/src/main/assets/index.html
          cp manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png /tmp/fuerza-app/app/src/main/assets/
          cp img/maniqui-front.jpg img/maniqui-back.jpg /tmp/fuerza-app/app/src/main/assets/img/
          cp img/*.svg /tmp/fuerza-app/app/src/main/assets/img/
          cat > /tmp/fuerza-app/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'FuerzaEnCasa'
          include ':app'
          EOT
          cat > /tmp/fuerza-app/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > /tmp/fuerza-app/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'io.github.emanuelyt.fuerzaencasa'
              compileSdk 35
              defaultConfig { applicationId 'io.github.emanuelyt.fuerzaencasa'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1' }
          }
          EOT
          cat > /tmp/fuerza-app/app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Fuerza en Casa" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > /tmp/fuerza-app/app/src/main/java/io/github/emanuelyt/fuerzaencasa/MainActivity.java <<'EOT'
          package io.github.emanuelyt.fuerzaencasa;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;
          public class MainActivity extends Activity {
              private WebView web;
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xff10100f);
                  getWindow().setNavigationBarColor(0xff10100f);
                  web = new WebView(this);
                  web.setBackgroundColor(0xff10100f);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u=req.getUrl();
                          if ("https".equals(u.getScheme())) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                              return true;
                          }
                          return !"file".equals(u.getScheme());
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html?app=1");
              }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOT
          mkdir -p /tmp/fuerza-app/app/src/main/res/drawable
          cp icon-192.png /tmp/fuerza-app/app/src/main/res/drawable/appicon.png
          sed -i 's/<application android:label=/<application android:icon="@drawable\/appicon" android:label=/' /tmp/fuerza-app/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        run: gradle --no-daemon -p /tmp/fuerza-app assembleDebug
      - name: Publicar APK para descargar
        run: |
          mkdir -p downloads
          cp /tmp/fuerza-app/app/build/outputs/apk/debug/app-debug.apk downloads/fuerza-en-casa.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/fuerza-en-casa.apk
          git commit -m 'Publicar APK de Fuerza en Casa'
          git push
