name: Compilar APK Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar proyecto Android
        shell: bash
        run: |
          mkdir -p /tmp/fuerza-app/app/src/main/java/io/github/emanuelyt/fuerzaencasa
          mkdir -p /tmp/fuerza-app/app/src/main/assets/img
          cp app.html /tmp/fuerza-app/app/src/main/assets/index.html
          cp firebase-config.js app-account.js /tmp/fuerza-app/app/src/main/assets/
          cp manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png /tmp/fuerza-app/app/src/main/assets/
          cp img/maniqui-front.jpg img/maniqui-back.jpg /tmp/fuerza-app/app/src/main/assets/img/
          cp img/*.svg /tmp/fuerza-app/app/src/main/assets/img/
          cat > /tmp/fuerza-app/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Strong'
          include ':app'
          EOT
          cat > /tmp/fuerza-app/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > /tmp/fuerza-app/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'io.github.emanuelyt.fuerzaencasa'
              compileSdk 35
              defaultConfig { applicationId 'io.github.emanuelyt.fuerzaencasa'; minSdk 23; targetSdk 35; versionCode 10; versionName '1.9' }
          }
          EOT
          cat > /tmp/fuerza-app/app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:icon="@drawable/appicon" android:label="Strong" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > /tmp/fuerza-app/app/src/main/java/io/github/emanuelyt/fuerzaencasa/MainActivity.java <<'EOT'
          package io.github.emanuelyt.fuerzaencasa;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.content.ClipboardManager;
          import android.content.ClipData;
          public class MainActivity extends Activity {
              private WebView web;
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xff10100f);
                  getWindow().setNavigationBarColor(0xff10100f);
                  web = new WebView(this);
                  web.setBackgroundColor(0xff10100f);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void copy(String text) {
                          ClipboardManager clipboard=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                          clipboard.setPrimaryClip(ClipData.newPlainText("Strong · respaldo",text));
                      }
                  }, "AndroidBackup");
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u=req.getUrl();
                          if ("https".equals(u.getScheme()) && "emanuel-yt.github.io".equals(u.getHost()) && u.getPath().startsWith("/fuerza-en-casa/")) return false;
                          if ("https".equals(u.getScheme())) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                              return true;
                          }
                          return !"file".equals(u.getScheme());
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://emanuel-yt.github.io/fuerza-en-casa/app.html?app=1&v=19");
              }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOT
          mkdir -p /tmp/fuerza-app/app/src/main/res/drawable
          cp icon-192.png /tmp/fuerza-app/app/src/main/res/drawable/appicon.png
      - name: Compilar APK
        run: gradle --no-daemon -p /tmp/fuerza-app assembleDebug
      - name: Publicar APK para descargar
        run: |
          mkdir -p downloads
          cp /tmp/fuerza-app/app/build/outputs/apk/debug/app-debug.apk downloads/strong-v1-9.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/strong-v1-9.apk
          git commit -m 'Publicar APK de Fuerza en Casa'
          git push
